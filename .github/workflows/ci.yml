name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Swift)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift format lint
        run: xcrun swift-format lint -r apps/macos/Sources apps/macos/Tests

      - name: Unit and integration tests
        run: make test-macos

      - name: Release build
        run: make -C apps/macos release

  android:
    name: Android (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write local.properties
        working-directory: apps/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Unit tests and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug

      - name: Assemble debug APK
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug

  e2e-loopback:
    name: E2E loopback
    runs-on: macos-14
    needs: [macos, android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Loopback e2e (probe host + Kotlin simulator)
        run: ./scripts/e2e.sh
